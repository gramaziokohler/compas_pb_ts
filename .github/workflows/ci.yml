name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # Biome
      - uses: biomejs/setup-biome@v2
      - run: biome ci .

      # Protobuf schema and generated-code drift
      - uses: arduino/setup-protoc@v3
        with:
          version: "34.0"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm proto:check

      # Build
      - run: pnpm build

      # Tests
      - run: pnpm test
